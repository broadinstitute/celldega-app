<?xml version="1.0" encoding="UTF-8"?>
<!--
  App icon: the Celldega logo mark centred on a white rounded square.

  Built as vector so every raster size is rendered directly from this file
  rather than resampled from one bitmap. The white plate follows the macOS
  icon grid (824x824 inside a 1024 canvas) and keeps the blue mark legible
  on dark docks and dark Finder backgrounds, where a transparent logo
  would nearly disappear.

  Logo mark is Celldega_LOGO_Full_Color_Logo_Mark.svg (viewBox 174.4x112.1),
  scaled 3.784x and centred.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
