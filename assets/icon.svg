<?xml version="1.0" encoding="UTF-8"?>
<!--
  App icon: the Celldega logo mark on a transparent background.

  Built as vector so every raster size is rendered directly from this file
  rather than resampled from one bitmap.

  No background plate, so the mark is inset to roughly 80% of the canvas
  rather than the 64% a plate would allow. Transparent icons read as smaller
  than plated ones at the same scale, and macOS expects the artwork itself
  to fill most of the tile.

  Logo mark is the official "Full Color / Logo Mark" variant
  (viewBox 174.4x112.1), scaled 4.702x and centred.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <g transform="translate(102 248.5) scale(4.702)">
    <rect fill="#006db6" x="95.1" y="3.9" width="30.2" height="51.8"/>
    <rect fill="#00afd7" x="140.5" y="3.9" width="30.2" height="51.8"/>
    <rect fill="#00afd7" x="49.8" y="3.9" width="30.2" height="51.8"/>
    <rect fill="#006db6" x="4.4" y="3.9" width="30.2" height="51.8"/>
    <path fill="#006db6" d="M171.5,85.9c-1,14-11,22.5-21,22.1h-.1c-9.7.3-19.4-7.6-20.9-20.8-1.6,13.2-11.2,21.1-20.9,20.8h0c-9.7.3-19.4-7.6-20.9-20.8-1.6,13.2-11.2,21.1-20.9,20.8h0c-9.7.3-19.4-7.6-20.9-20.8-1.6,13.2-11.2,21.1-20.9,20.8h-.1c-10,.3-20-8.2-21.1-22.1-.3-4.4-.2-12.8-.2-17.5h168.6c0,4.7,0,13.1-.2,17.5h-.3Z"/>
  </g>
</svg>
