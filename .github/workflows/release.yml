# Build installers for all three platforms and attach them to a GitHub Release.
#
# Electron Forge can only build for the platform it runs on, so this fans out
# across three runners. Push a tag to trigger it:
#
#   npm version 0.1.0 && git push --follow-tags
#
# Or run it by hand from the Actions tab.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is the priority platform and must pass.
          #
          # One universal build rather than separate arm64 + Intel jobs: the
          # macos-13 (Intel) runner is end-of-life and sat unassigned for
          # ~25 minutes on the v0.1.0 run, blocking the whole release. An
          # arm64 runner can stitch both slices, so this removes the
          # dependency on a deprecated image and ships a single DMG that runs
          # natively on every Mac.
          - os: macos-latest
            name: macos-universal
            arch: universal
            required: true
          # Best-effort: a failure here must not block a macOS release, since
          # the release job depends on this one completing.
          - os: windows-latest
            name: windows-x64
            required: false
          - os: ubuntu-latest
            name: linux-x64
            required: false

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # maker-rpm needs the rpm binary and maker-deb needs fakeroot; neither is
      # present on the ubuntu runner by default.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - run: npm ci

      - name: Build distributables
        run: npm run make ${{ matrix.arch && format('-- --arch={0}', matrix.arch) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: celldega-app-${{ matrix.name }}
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip
            out/make/**/*.exe
            out/make/**/*.deb
            out/make/**/*.rpm
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            Desktop viewer for DegaFiles / Landscape datasets, powered by Celldega.js.

            **You do not need Node.js, npm, or Python** — the download is self-contained.

            ## Install on macOS

            Download **`Celldega-App-*-universal.dmg`** below. It runs natively on both
            Apple Silicon and Intel Macs, so there is nothing to choose between.

            1. Double-click the `.dmg`
            2. Drag the **Celldega** icon onto the **Applications** folder
            3. Open **Celldega** from Applications

            ### First launch: "Apple could not verify..."

            You will see this warning once. It appears because the app is not yet signed
            with a paid Apple Developer certificate — **not** because anything is wrong
            with the app. macOS shows it for every unsigned app.

            **macOS 15 (Sequoia) and newer** — right-click → Open no longer works, Apple
            removed that shortcut:

            1. Click **Done** on the warning
            2. Open  → **System Settings** → **Privacy & Security**
            3. Scroll to **Security** — you will see *"celldega was blocked to protect your Mac."*
            4. Click **Open Anyway**, authenticate, then click **Open**

            **macOS 14 (Sonoma) and older** — right-click Celldega → **Open** → **Open**.

            Terminal alternative (any version):
            ```sh
            xattr -dr com.apple.quarantine /Applications/Celldega.app
            ```

            ## Install on Windows

            Run **`Celldega-Setup.exe`**. SmartScreen will warn that the publisher is
            unrecognised — choose **More info** → **Run anyway**.

            ## Linux

            Not available in this release; the Linux build is still being fixed.

            ---

            Full instructions in the [README](https://github.com/broadinstitute/celldega-app#install).
